# This is the full NGINX configuration file used by the NGINX container.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { 
  worker_connections 1024; 
}

stream {
    # Define upstream groups for different services.
    upstream mail_smtps {
        # Mailserver's implicit TLS port (for example, 465)
        server mailserver:465;
    }
    upstream mail_submission {
        # Mailserver's TLS submission port (587)
        server mailserver:587;
    }
    upstream mail_smtp {
        # Mailserver's non-TLS SMTP port (25)
        server mailserver:25;
    }
    upstream mail_imaps {
        # Mailserver's IMAP port (993)
        server mailserver:993;
    }
    upstream mail_pop3s {
        # Mailserver's POP3 port (995)
        server mailserver:995;
    }

    # Map SNI to the proper upstream based on the hostname used during the TLS handshake.
    map $ssl_preread_server_name $upstream_backend {
        mail.prodg.xyz       mail_smtps;
        submission.prodg.xyz mail_submission;
        imap.prodg.xyz       mail_imaps;
        pop.prodg.xyz        mail_pop3s;
        default              mail_smtp;
    }

    server {
        # Listen on the Funnel-exposed port (443)
        listen 443;
        # Enable SNI extraction from TLS handshake.
        ssl_preread on;
        # Pass along the connection to the chosen upstream.
        proxy_pass $upstream_backend;
    }
} 